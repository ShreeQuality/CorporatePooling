<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1376" width="768" height="1376">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="36%" r="60%" fx="50%" fy="36%">
      <stop offset="0%" stop-color="#0a3246" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#061826" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#040914" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020409" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feGaussianBlur stdDeviation="24" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients for Chariot & Horse -->
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00e5c8"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6df5ff"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <linearGradient id="bodyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003547" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#001824" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Deep Luxury Canvas -->
  <rect width="768" height="1376" fill="url(#bgGlow)"/>

  <!-- Ambient Light Orb behind Chariot -->
  <circle cx="384" cy="420" r="240" fill="#00d4ff" opacity="0.09" filter="url(#neonGlow)"/>
  <circle cx="384" cy="420" r="150" fill="#00ffa3" opacity="0.07" filter="url(#neonGlow)"/>

  <!-- ==================== MAIN CHARIOT & HORSE EMBLEM (NO CANDLE BOXES) ==================== -->
  <g transform="translate(384, 400) scale(1.35)" filter="url(#neonGlow)" text-anchor="middle">
    
    <!-- 1. CHARIOT TOP FLAG & POLE -->
    <path d="M 0 -195 L 0 -150" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 -195 Q 26 -206 42 -190 Q 24 -180 0 -180 Z" fill="url(#cyanEmerald)" stroke="#00f0ff" stroke-width="1.8"/>
    <circle cx="0" cy="-150" r="6.5" fill="#6df5ff"/>

    <!-- 2. CANOPY DOME & ROOF -->
    <!-- Dome Base & Ribs -->
    <path d="M -75 -110 C -75 -152 -32 -152 0 -152 C 32 -152 75 -152 75 -110 Z" 
          fill="url(#bodyFill)" stroke="url(#cyanEmerald)" stroke-width="4.2" stroke-linejoin="round"/>
    
    <!-- Canopy Rib Arcs -->
    <path d="M 0 -152 Q -28 -128 -38 -110" stroke="#00d4ff" stroke-width="2.8" fill="none"/>
    <path d="M 0 -152 Q 28 -128 38 -110" stroke="#00d4ff" stroke-width="2.8" fill="none"/>
    <path d="M 0 -152 L 0 -110" stroke="#00d4ff" stroke-width="2.8" fill="none"/>

    <!-- Scalloped Canopy Valance Trim -->
    <path d="M -82 -110 Q -68 -96 -54 -110 Q -40 -96 -26 -110 Q -12 -96 0 -110 Q 12 -96 26 -110 Q 40 -96 54 -110 Q 68 -96 82 -110 L 82 -104 Q 68 -90 54 -104 Q 40 -90 26 -104 Q 12 -90 0 -104 Q -12 -90 -26 -104 Q -40 -90 -54 -104 Q -68 -90 -82 -104 Z" 
          fill="url(#cyanEmerald)" stroke="#00ffa3" stroke-width="1.8"/>

    <!-- 3. CARRIAGE MAIN PILLARS & FRAME (Clean Pillars - NO Candle Lanterns) -->
    <!-- Left Curved Pillar -->
    <path d="M -70 -100 C -72 -50 -86 -15 -64 35 C -55 58 -36 68 -18 68" 
          fill="none" stroke="url(#cyanEmerald)" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Curved Pillar -->
    <path d="M 70 -100 C 72 -50 86 -15 64 35 C 55 58 36 68 18 68" 
          fill="none" stroke="url(#cyanEmerald)" stroke-width="4" stroke-linecap="round"/>

    <!-- Inner Carriage Backrest Arc -->
    <path d="M -50 -95 C -50 -48 -64 8 -36 40 L 36 40 C 64 8 50 -48 50 -95 Z" 
          fill="url(#bodyFill)" stroke="#00d4ff" stroke-width="3"/>

    <!-- 4. DUAL SPOKED CHARIOT WHEELS -->
    <!-- Left Wheel (Perspective Oval) -->
    <g transform="translate(-76, 25)">
      <!-- Outer & Inner Rims -->
      <ellipse cx="0" cy="0" rx="15" ry="62" fill="url(#bodyFill)" stroke="url(#wheelGrad)" stroke-width="4.5"/>
      <ellipse cx="0" cy="0" rx="9" ry="48" fill="none" stroke="#00f5d4" stroke-width="2.2" opacity="0.85"/>
      <!-- Hub -->
      <ellipse cx="0" cy="0" rx="4.5" ry="9" fill="#6df5ff"/>
      <!-- Spokes -->
      <line x1="0" y1="-48" x2="0" y2="48" stroke="#00f0ff" stroke-width="2.2"/>
      <line x1="-7" y1="-28" x2="7" y2="28" stroke="#00f0ff" stroke-width="1.8"/>
      <line x1="-7" y1="28" x2="7" y2="-28" stroke="#00f0ff" stroke-width="1.8"/>
    </g>

    <!-- Right Wheel (Perspective Oval) -->
    <g transform="translate(76, 25)">
      <!-- Outer & Inner Rims -->
      <ellipse cx="0" cy="0" rx="15" ry="62" fill="url(#bodyFill)" stroke="url(#wheelGrad)" stroke-width="4.5"/>
      <ellipse cx="0" cy="0" rx="9" ry="48" fill="none" stroke="#00f5d4" stroke-width="2.2" opacity="0.85"/>
      <!-- Hub -->
      <ellipse cx="0" cy="0" rx="4.5" ry="9" fill="#6df5ff"/>
      <!-- Spokes -->
      <line x1="0" y1="-48" x2="0" y2="48" stroke="#00f0ff" stroke-width="2.2"/>
      <line x1="-7" y1="-28" x2="7" y2="28" stroke="#00f0ff" stroke-width="1.8"/>
      <line x1="-7" y1="28" x2="7" y2="-28" stroke="#00f0ff" stroke-width="1.8"/>
    </g>

    <!-- Horizontal Axle Bar -->
    <path d="M -64 30 L 64 30" stroke="#00ffa3" stroke-width="4" stroke-linecap="round"/>

    <!-- 5. MAJESTIC FRONT-FACING HORSE -->
    <!-- Horse Chest & Body -->
    <path d="M -24 -8 C -42 18 -36 62 -20 95 L 20 95 C 36 62 42 18 24 -8 Z" 
          fill="url(#bodyFill)" stroke="url(#cyanBlue)" stroke-width="3.8" stroke-linejoin="round"/>
    
    <!-- Chest Harness & Royal Medallion -->
    <path d="M -24 2 Q 0 32 24 2" fill="none" stroke="url(#cyanEmerald)" stroke-width="3.8"/>
    <path d="M -18 24 Q 0 50 18 24" fill="none" stroke="#00f5d4" stroke-width="2.8"/>
    <circle cx="0" cy="38" r="6.5" fill="url(#cyanEmerald)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Front Left Leg -->
    <path d="M -14 85 L -12 130 L -16 145 L -10 150 L -8 130 L -6 85" 
          fill="url(#bodyFill)" stroke="url(#cyanEmerald)" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Left Hoof -->
    <path d="M -18 145 L -7 145 L -5 155 L -20 155 Z" fill="#00ffa3" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Front Right Leg -->
    <path d="M 14 85 L 12 130 L 16 145 L 10 150 L 8 130 L 6 85" 
          fill="url(#bodyFill)" stroke="url(#cyanEmerald)" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Right Hoof -->
    <path d="M 18 145 L 7 145 L 5 155 L 20 155 Z" fill="#00ffa3" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Horse Neck & Head -->
    <!-- Neck -->
    <path d="M -16 -48 L -24 -8 L 24 -8 L 16 -48 Z" fill="url(#bodyFill)" stroke="url(#cyanBlue)" stroke-width="3.2"/>

    <!-- Head Outline -->
    <path d="M -11 -80 C -20 -65 -16 -38 -12 -20 C -8 -12 -6 0 0 0 C 6 0 8 -12 12 -20 C 16 -38 20 -65 11 -80 Z" 
          fill="url(#bodyFill)" stroke="url(#cyanEmerald)" stroke-width="3.6" stroke-linejoin="round"/>

    <!-- Muzzle / Snout -->
    <ellipse cx="0" cy="-12" rx="7.5" ry="9" fill="url(#cyanEmerald)" opacity="0.85"/>
    <!-- Nostrils -->
    <circle cx="-3" cy="-10" r="1.4" fill="#040914"/>
    <circle cx="3" cy="-10" r="1.4" fill="#040914"/>

    <!-- Eyes (Intelligent, Alert) -->
    <ellipse cx="-7" cy="-42" rx="2.2" ry="4" fill="#6df5ff" transform="rotate(-12, -7, -42)"/>
    <ellipse cx="7" cy="-42" rx="2.2" ry="4" fill="#6df5ff" transform="rotate(12, 7, -42)"/>

    <!-- Ears -->
    <path d="M -11 -78 L -16 -100 L -5 -84 Z" fill="url(#cyanEmerald)" stroke="#00ffa3" stroke-width="2.2"/>
    <path d="M 11 -78 L 16 -100 L 5 -84 Z" fill="url(#cyanEmerald)" stroke="#00ffa3" stroke-width="2.2"/>

    <!-- Flowing Forelock & Mane -->
    <path d="M -5 -86 Q 0 -104 5 -86 Q 8 -68 0 -58 Q -5 -72 -5 -86 Z" 
          fill="#6df5ff" stroke="#00ffa3" stroke-width="1.8"/>
    <path d="M -12 -58 Q -19 -40 -14 -26" stroke="#00d4ff" stroke-width="2.2" fill="none"/>
    <path d="M 12 -58 Q 19 -40 14 -26" stroke="#00d4ff" stroke-width="2.2" fill="none"/>

    <!-- Bridle Straps -->
    <line x1="-10" y1="-50" x2="10" y2="-50" stroke="#00ffa3" stroke-width="2.2"/>
    <line x1="-8" y1="-26" x2="8" y2="-26" stroke="#00ffa3" stroke-width="2.2"/>
    <line x1="0" y1="-50" x2="0" y2="-26" stroke="#00ffa3" stroke-width="2.2"/>
  </g>

  <!-- ==================== TYPOGRAPHY & BRANDING ==================== -->
  <!-- KarmaRide Title -->
  <text x="384" y="730" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="62" 
        font-weight="800" 
        letter-spacing="1.5" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#softGlow)">KarmaRide</text>

  <!-- Subtitle Tagline -->
  <text x="384" y="780" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        font-weight="500" 
        letter-spacing="2" 
        fill="#00e5c8" 
        text-anchor="middle">Smart • Verified • Sustainable Commutes</text>

  <!-- ==================== BOTTOM SYSTEM STATUS & SSO ==================== -->
  <!-- Animated Pulse Progress Ring -->
  <g transform="translate(384, 1180)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.2"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#cyanEmerald)" stroke-width="3.5" 
            stroke-dasharray="120 40" stroke-linecap="round"/>
  </g>

  <!-- Footer SSO Text -->
  <text x="384" y="1235" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="16" 
        font-weight="400" 
        letter-spacing="0.5" 
        fill="#7e9bb5" 
        text-anchor="middle">Secured with Enterprise SSO &amp; Biometrics</text>
</svg>
